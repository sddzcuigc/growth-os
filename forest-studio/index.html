function stage(s,profile,id){const rs=s.records.filter(r=>r.profile===profile&&r.island===id),solo=rs.filter(r=>r.support==="solo"),days=new Set(solo.map(r=>r.date)).size,types=new Set(solo.map(r=>r.task)).size;return !rs.length?0:!solo.length?1:days<3?2:days<5||types<2?3:4}
function validate(s){if(!s||s.version!==1||!Array.isArray(s.records)||!Array.isArray(s.family)||s.records.length>10000||s.family.length>10000)return null;let n=blank();for(const r of s.records){if(!r||!addRecord(n,r))return null}for(const f of s.family){if(!f||!familyTasks.some(t=>t.id===f.id)||!/^\d{4}-\d{2}-\d{2}$/.test(f.date)||!String(f.evidence||"").trim()||n.family.some(x=>x.id===f.id&&x.date===f.date))return null;n.family.push({id:f.id,date:f.date,evidence:String(f.evidence).slice(0,500)})}return n}
const key="cui-forest-studio-v1", names=["种子","萌芽","独立尝试","持续成长","跨场景应用"],profiles={older:"哥哥",younger:"妹妹"},pages=[["map","⌘","成长森林"],["today","◷","今日冒险"],["collection","✧","贴纸收藏"],["family","⌂","家庭营地"],["parent","▤","成长档案"]],supportNames={together:"一起完成",hint:"少量提示",solo:"独立完成"};
let state=blank(),storageOK=true;try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved){const v=validate(saved);if(v){state=v;state.profile=profiles[saved.profile]?saved.profile:"older";state.view=pages.some(p=>p[0]===saved.view)?saved.view:"map";state.island=catalog.some(i=>i.id===saved.island)?saved.island:"manage"}}}catch(e){storageOK=false}
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast("本机保存失败，请导出备份。")}}let toastTimer;function toast(t){$("#toast").textContent=t;$("#toast").hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").hidden=true,3500)}
function sticker(icon){return '<svg class="sticker" viewBox="0 0 128 128" aria-hidden="true"><g stroke-linejoin="round">'+art[icon]+'</g></svg>'}
function terrain(i){return '<svg class="terrain" viewBox="0 0 160 92" aria-hidden="true"><path d="M10 46 80 13 150 46 150 62 80 88 10 62Z" fill="#a6a88a"/><path d="M10 46 80 75 150 46 80 13Z" fill="'+i.color+'" stroke="#a1ac90" stroke-width="1.3"/><path d="M10 46 80 75 80 88 10 62Z" fill="#b7b695"/><path d="M80 75 150 46 150 62 80 88Z" fill="#8eaa83"/><path d="M16 45 80 17 143 45 80 71Z" fill="none" stroke="#fff" stroke-opacity=".5"/><g fill="#6f8c62"><path d="m27 38 8-15 8 15h-5v7h-6v-7Z"/><path d="m120 50 7-13 7 13h-5v5h-4v-5Z"/></g><circle cx="48" cy="50" r="3" fill="#f5e7a9"/><circle cx="112" cy="38" r="2.5" fill="#fbf0bc"/></svg>'}
function title(k,t,d){return '<div class="eyebrow">'+k+'</div><h1 class="title">'+t+'</h1><p class="subtitle">'+d+'</p>'}function header(t,d){return '<div class="sectionhead"><div><h2>'+t+'</h2><p>'+d+'</p></div></div>'}
function progress(i){const n=stage(state,state.profile,i.id);return '<div class="path" aria-label="阶段 '+names[n]+'">'+names.map((x,j)=>'<span class="node '+(j<=n?'on':'')+'"></span>').join("")+'</div><span class="stage-label">'+names[n]+'</span>'}
function done(i,t){return state.records.some(r=>r.profile===state.profile&&r.island===i.id&&r.task===t&&r.date===dayKey())}
function pick(){const first=catalog.find(i=>i.id===state.island)||catalog[2];for(const i of [first,...catalog.filter(x=>x!==first)]){const t=i.tasks.findIndex((_,j)=>!done(i,j));if(t>=0)return [i,t]}return null}
function taskCard(i,t){const task=i.tasks[t],complete=done(i,t);return '<article class="card task"><div class="task-top"><span>'+i.name+'</span><span class="badge">'+(complete?'今日已记录':state.profile==="younger"?'5–8 分钟':'10–15 分钟')+'</span></div><h3>'+task[0]+'</h3><p>'+task[1]+'</p><button class="secondary" data-task="'+i.id+':'+t+'" '+(complete?'disabled':'')+'>'+ (complete?'已完成':'开始探索')+'</button></article>'}
function mapPage(){const i=catalog.find(x=>x.id===state.island),p=pick();return title("01 / THE FOREST","每一天，长出一点新能力。","选择一座岛屿，找到你愿意尝试的小挑战。")+'<div class="hero"><section class="forest"><div class="forest-head"><b>你的成长群岛</b><span class="tag">自由探索 · 6 座岛屿</span></div><div class="map" id="map">'+catalog.map(x=>'<button class="island '+(i.id===x.id?'active':'')+'" data-island="'+x.id+'" aria-pressed="'+(i.id===x.id)+'"><span class="island-base">'+terrain(x)+sticker(x.icon)+'</span><span class="island-label">'+x.name+'</span><small>'+names[stage(state,state.profile,x.id)]+'</small></button>').join("")+'</div></section><section class="next"><span class="eyebrow">ONE SMALL STEP / 今日一步</span>'+sticker(p?p[0].icon:i.icon)+'<h2>'+(p?p[0].tasks[p[1]][0]:'今天已经探索得很充分')+'</h2><p>'+(p?p[0].tasks[p[1]][1]+'。按自己的节奏，不必全部做完。':'可以休息，或去家庭营地看看。')+'</p><button class="primary" '+(p?'data-task="'+p[0].id+':'+p[1]+'"':'data-view="family"')+'>'+(p?'开始我的小挑战':'前往家庭营地')+'　→</button></section></div>'+header(i.name,i.desc)+'<div class="card" style="border-left:4px solid '+i.ink+'">'+progress(i)+'<p style="margin:8px 0 0">成长阶段来自不同日期的实际练习记录，不由积分决定。</p></div><div class="sectionhead"><h2>岛屿任务</h2></div><div class="grid">'+i.tasks.map((_,j)=>taskCard(i,j)).join("")+'</div><div class="note">练习不等于考试。可以请家人帮助，也可以暂停；记录帮助方式，才能看到自己正在变得更独立。</div>'}
function todayPage(){const p=pick(),n=state.records.filter(r=>r.profile===state.profile&&r.date===dayKey()).length;return title("02 / DAILY QUEST","今天只需要一小步。","选择一个任务，完成、检查，再留下真实的发现。")+'<div class="stats"><div class="card stat"><strong>'+n+'</strong><span>今日行动记录</span></div><div class="card stat"><strong>'+state.records.filter(r=>r.profile===state.profile&&r.date===dayKey()&&r.support==="solo").length+'</strong><span>今日独立尝试</span></div><div class="card stat"><strong>'+ (state.profile==="younger"?'5–8':'10–15')+'</strong><span>建议单次分钟数</span></div></div>'+header("从这几个开始","自主选择；不用全部完成。")+'<div class="grid">'+(p?[p[0],...catalog.filter(i=>i!==p[0])].slice(0,3).map(i=>{const t=i.tasks.findIndex((_,j)=>!done(i,j));return taskCard(i,t<0?0:t)}).join(""):'<div class="card">今天可以休息了。</div>')+'</div>'+header("今日足迹","记录做了什么，而不是做得有多快。")+'<div class="card">'+recordsHTML(state.records.filter(r=>r.profile===state.profile&&r.date===dayKey()))+'</div>'}
function collectionPage(){return title("03 / FIELD NOTES","我的贴纸博物馆","每张贴纸都是一次真实尝试留下的印记。")+'<div class="sectionhead"><h2>六座岛屿的收藏</h2></div><div class="collection">'+catalog.map(i=>{const n=stage(state,state.profile,i.id);return '<article class="card collect '+(!n?'locked':'')+'">'+sticker(i.icon)+'<h3>'+i.name+'</h3>'+progress(i)+'<p>'+(n?'已经留下成长记录':'完成一次真实任务解锁')+'</p></article>'}).join("")+'</div>'+header("探索纪念","当你在多个日子、不同任务中尝试独立完成，森林会记录这一变化。")+'<div class="card"><p>当前有 '+catalog.filter(i=>stage(state,state.profile,i.id)>0).length+' 枚岛屿贴纸。贴纸不会因休息、暂停或漏做而消失。</p></div>'}
function familyPage(){return title("04 / BASE CAMP","把成长变成共同经历。","这里没有个人排名，只有一起做过的事情。")+'<div class="family-banner">'+sticker("house")+'<div><h2>崔家小营地</h2><p>已记录 '+state.family.length+' 次共同探索 · 一起计划、一起动手、一起回顾。</p></div></div><div class="grid">'+familyTasks.map(t=>'<article class="card task"><span class="eyebrow">CO-OP QUEST</span><h3>'+t.name+'</h3><p>'+t.steps+'</p><button class="secondary" data-family="'+t.id+'" '+(state.family.some(f=>f.id===t.id&&f.date===dayKey())?'disabled':'')+'>记录共同任务</button></article>').join("")+'</div>'+header("家庭足迹","一起做过的事，比谁做得更多更重要。")+'<div class="card">'+(state.family.length?[...state.family].reverse().map(f=>'<div class="record">'+sticker("house")+'<div><b>'+familyTasks.find(t=>t.id===f.id).name+'</b><p>'+esc(f.evidence)+'</p><small>'+f.date+'</small></div><button class="secondary record-action" data-remove-family="'+f.id+':'+f.date+'">撤回</button></div>').join(""):'<div class="empty">还没有共同任务记录。</div>')+'</div>'}
function recordsHTML(rs){return rs.length?[...rs].reverse().map(r=>{const i=catalog.find(x=>x.id===r.island);return '<div class="record">'+sticker(i.icon)+'<div><b>'+i.tasks[r.task][0]+'</b><p>'+esc(r.evidence)+'</p><small>'+r.date+' · '+supportNames[r.support]+'</small></div><button class="secondary record-action" data-remove="'+r.profile+':'+r.island+':'+r.task+':'+r.date+'">撤回</button></div>'}).join(""):'<div class="empty">还没有行动记录。开始一个你喜欢的任务吧。</div>'}
function parentPage(){const now=new Date();now.setDate(now.getDate()-6);const start=dayKey(now),rs=state.records.filter(r=>r.profile===state.profile),week=rs.filter(r=>r.date>=start&&r.date<=dayKey()),solo=week.filter(r=>r.support==="solo").length;return title("05 / GROWTH JOURNAL","看见真实的成长。","当前角色："+profiles[state.profile]+"。以下记录为家庭自报，不是诊断或能力测验。")+'<div class="stats"><div class="card stat"><strong>'+week.length+'</strong><span>最近 7 天记录</span></div><div class="card stat"><strong>'+(week.length?Math.round(solo/week.length*100)+"%":"—")+'</strong><span>自报独立完成比例</span></div><div class="card stat"><strong>'+new Set(week.map(r=>r.date)).size+'</strong><span>最近 7 天练习日</span></div></div>'+header("能力阶段","不与另一个孩子比较，只观察当前角色自己的变化。")+'<div class="grid">'+catalog.map(i=>'<article class="card"><div style="display:flex;align-items:center;gap:8px">'+sticker(i.icon)+'<h3>'+i.name+'</h3></div>'+progress(i)+'<p>'+rs.filter(r=>r.island===i.id).length+' 次有效记录</p></article>').join("")+'</div>'+header("行动证据","你可以撤回错误或重复记录。")+'<div class="card">'+recordsHTML(rs)+'</div>'+header("本机数据管理","备份包含两个角色的记录与家庭任务；导入会替换本机体验版记录。")+'<div class="card"><div class="actions"><button class="secondary" data-export>导出 JSON 备份</button><button class="secondary" data-import>导入 JSON 备份</button></div><p class="small">不上传数据，不连接原版云端；此入口没有身份验证或家长权限隔离。请勿录入隐私信息。</p></div>'}
function render(){ $("#nav").innerHTML=pages.map(p=>'<button data-view="'+p[0]+'" class="'+(state.view===p[0]?'active':'')+'" '+(state.view===p[0]?'aria-current="page"':'')+'><i aria-hidden="true">'+p[1]+'</i>'+p[2]+'</button>').join("");$("#profiles").innerHTML=Object.keys(profiles).map(p=>'<button data-profile="'+p+'" class="'+(state.profile===p?'active':'')+'" aria-pressed="'+(state.profile===p)+'">'+profiles[p]+'</button>').join("");$("#content").innerHTML=({map:mapPage,today:todayPage,collection:collectionPage,family:familyPage,parent:parentPage}[state.view])();const m=$("#map");if(m&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&matchMedia("(hover: hover)").matches){m.addEventListener("pointermove",e=>{const b=m.getBoundingClientRect();m.style.setProperty("--ry",((e.clientX-b.left)/b.width-.5)*8+"deg");m.style.setProperty("--rx",(-((e.clientY-b.top)/b.height-.5)*6)+"deg")});m.addEventListener("pointerleave",()=>{m.style.setProperty("--rx","0deg");m.style.setProperty("--ry","0deg")})}if(!storageOK)$("#content").insertAdjacentHTML("afterbegin",'<div class="note">本机存储不可用，请及时导出备份。</div>')}
let active=null;function openTask(id,t){const i=catalog.find(x=>x.id===id);if(!i||done(i,t))return;const task=i.tasks[t];active={id,t,profile:state.profile,date:dayKey()};const steps=task[2].split("|");$("#dialog").innerHTML='<div class="dialog-inner"><div class="dialog-header"><div><span class="eyebrow">'+i.name+' / 小挑战</span><h2 id="dialog-title">'+task[0]+'</h2></div><button class="close" aria-label="关闭" data-close>×</button></div><p>'+task[1]+'。'+(state.profile==="younger"?'可以请家人读出提示，一步一步来。':'先自己决定怎么做，再检查结果。')+'</p><div class="steps">'+steps.map((s,j)=>'<label class="step"><input type="checkbox" data-step><span>第 '+(j+1)+' 步 · '+s+'</span></label>').join("")+'</div><div class="field"><label>这次你需要多少帮助？</label><div class="choices">'+Object.entries(supportNames).map(([v,n])=>'<label><input type="radio" name="support" value="'+v+'">'+n+'</label>').join("")+'</div></div><div class="field"><label for="evidence">我做了什么？我发现了什么？</label><textarea id="evidence" maxlength="500" placeholder="写下具体结果，可以请家人代记。"></textarea></div><button class="primary" data-finish disabled>留下成长记录</button><p>不想继续时可以关闭，不会扣分。</p></div>';$("#dialog").showModal()}
function openFamily(id){const t=familyTasks.find(x=>x.id===id);if(!t)return;active={family:id,date:dayKey()};$("#dialog").innerHTML='<div class="dialog-inner"><div class="dialog-header"><h2 id="dialog-title">'+t.name+'</h2><button class="close" aria-label="关闭" data-close>×</button></div><p>'+t.steps+'</p><div class="field"><label for="evidence">我们一起做了什么？</label><textarea id="evidence" maxlength="500" placeholder="记录具体的行动或发现。"></textarea></div><button class="primary" data-finish disabled>记录共同成长</button></div>';$("#dialog").showModal()}
function readiness(){if(!active)return;const b=$("[data-finish]");if(!b)return;b.disabled=!$("#evidence").value.trim()||(!active.family&&(!document.querySelector('input[name="support"]:checked')||[...document.querySelectorAll("[data-step]")].some(x=>!x.checked)))}
$("#dialog").addEventListener("input",readiness);$("#dialog").addEventListener("change",readiness);$("#dialog").addEventListener("close",()=>{active=null});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.view){state.view=d.view;save();render();window.scrollTo(0,0)}else if(d.profile){state.profile=d.profile;save();render()}else if(d.island){state.island=d.island;save();render()}else if(d.task){const [i,t]=d.task.split(":");openTask(i,Number(t))}else if(d.family){openFamily(d.family)}else if("close" in d){$("#dialog").close()}else if("finish" in d){if(!active||b.disabled)return;const evidence=$("#evidence").value.trim();let ok=false;if(active.family){if(!state.family.some(f=>f.id===active.family&&f.date===active.date)){state.family.push({id:active.family,date:active.date,evidence});ok=true}}else{const support=document.querySelector('input[name="support"]:checked');ok=!!support&&addRecord(state,{profile:active.profile,island:active.id,task:active.t,date:active.date,support:support.value,evidence})}if(ok){save();$("#dialog").close();render();toast("已留下真实的成长足迹")}else toast("今天已经记录过这项任务。")}else if(d.remove){if(!confirm("撤回这条行动记录？相应技能阶段将重新计算。"))return;const [p,i,t,date]=d.remove.split(":");state.records=state.records.filter(r=>!(r.profile===p&&r.island===i&&r.task===Number(t)&&r.date===date));save();render();toast("已撤回记录")}else if(d.removeFamily){if(!confirm("撤回这条家庭记录？"))return;const [i,date]=d.removeFamily.split(":");state.family=state.family.filter(f=>!(f.id===i&&f.date===date));save();render()}else if("export" in d){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=url;a.download="forest-backup-"+dayKey()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if("import" in d){$("#import").click()}});
$("#import").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{if(f.size>8000000)throw Error();const v=validate(JSON.parse(await f.text()));if(!v)throw Error();if(!confirm("用备份替换本机两个角色与家庭记录？请先导出当前备份。"))return;state=v;state.view="parent";save();render();toast("备份已导入")}catch(e){toast("无法导入：备份格式无效。")}});render();
</script></body></html>
